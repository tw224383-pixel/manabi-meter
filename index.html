<script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;

  // ======================================================
  // ★★★ Firebase 設定 ★★★
  // Firebase コンソール（https://console.firebase.google.com/）で
  // プロジェクトを作成し、「ウェブアプリを追加」後に表示される
  // firebaseConfig の値をここに貼り付けてください。
  // ======================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAsYX7sKeUcPaew3WTXHygbL734Qa_NW1Q",
    authDomain: "education-check.firebaseapp.com",
    projectId: "education-check",
    storageBucket: "education-check.firebasestorage.app",
    messagingSenderId: "466153926634",

  // ======================================================

  // Firebase 初期化（Realtime Database）
  let db = null;

    if (!firebaseConfig.apiKey.startsWith('YOUR_')) {
      firebase.initializeApp(firebaseConfig);

  // ======================================================
  // 定数・ユーティリティ
  // ======================================================
  const SUBJECTS = ['算数', '国語', '理科', '社会', '英語', '体育', '図工', '音楽', '生活', 'その他'];

  const STATUS_CONFIG = {
    teach: { label: '教えたい！', emoji: '🙋', className: 'selected-teach', badgeClass: 'badge-teach', color: '#fde047' },
    wait:  { label: 'もう少し待って', emoji: '⏳', className: 'selected-wait', badgeClass: 'badge-wait', color: '#93c5fd' },
    help:  { label: '教えてください', emoji: '🆘', className: 'selected-help', badgeClass: 'badge-help', color: '#fca5a5' },
    solo:  { label: '一人でやりたい', emoji: '👤', className: 'selected-solo', badgeClass: 'badge-solo', color: '#c4b5fd' },
  };

  const LEVEL_CONFIG = [
    { level: 1, label: 'まだ難しい', emoji: '😢', className: 'level-1', shadow: 'rgba(239,68,68,0.4)' },
    { level: 2, label: 'むずかしい', emoji: '😕', className: 'level-2', shadow: 'rgba(249,115,22,0.4)' },
    { level: 3, label: 'ふつう',     emoji: '😐', className: 'level-3', shadow: 'rgba(234,179,8,0.4)' },
    { level: 4, label: 'だいたい OK', emoji: '😊', className: 'level-4', shadow: 'rgba(132,204,22,0.4)' },
    { level: 5, label: 'ばっちり！', emoji: '🎉', className: 'level-5', shadow: 'rgba(34,197,94,0.4)' },
  ];

  function generateClassId() {
    return String(Math.floor(10000 + Math.random() * 90000));
  }

  function formatTime(date) {
    return date.toLocaleString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  }

  // デバウンス（1秒）
  function useDebounce(fn, delay = 1000) {
    const timerRef = useRef(null);
    return useCallback((...args) => {
      if (timerRef.current) clearTimeout(timerRef.current);
      timerRef.current = setTimeout(() => fn(...args), delay);
    }, [fn, delay]);
  }

  // ======================================================
  // Firebase 操作
  // ======================================================
  async function initClass(classId, subject) {
    if (!firebaseReady) return;
    const ref = db.ref(`classes/${classId}`);
    const snap = await ref.once('value');
    if (!snap.exists()) {
      await ref.set({
        subject,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        students: {}
      });
    }
  }

  async function updateStudent(classId, studentKey, data) {
    if (!firebaseReady) { console.log('[MOCK] updateStudent', classId, studentKey, data); return; }
    const ref = db.ref(`classes/${classId}/students/${studentKey}`);
    await ref.update({
      ...data,
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    });
  }

  function subscribeClass(classId, callback) {
    if (!firebaseReady) return () => {};
    const ref = db.ref(`classes/${classId}`);
    const handler = snap => {
      if (snap.exists()) callback(snap.val());
    };
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }

  // 授業データを削除
  async function deleteClass(classId) {
    if (!firebaseReady) return;
    await db.ref(`classes/${classId}`).remove();
  }

  // 24時間以上前の古いクラスを自動削除
  async function cleanupOldClasses(hoursToKeep = 24) {
    if (!firebaseReady) return 0;
    const cutoff = Date.now() - hoursToKeep * 60 * 60 * 1000;
    try {
      const snap = await db.ref('classes').once('value');
      if (!snap.exists()) return 0;
      const tasks = [];
      snap.forEach(child => {
        const createdAt = child.val()?.createdAt || 0;
        if (createdAt < cutoff) {
          tasks.push(db.ref(`classes/${child.key}`).remove());
        }
      });
      await Promise.all(tasks);
      return tasks.length;
    } catch(e) {
      console.warn('cleanup error:', e);
      return 0;
    }
  }

              <button

                <span className="text-3xl">🧒</span>

          {!firebaseReady && (
            <div className="mt-6 glass p-4 max-w-sm w-full text-center">

          )}

  // ======================================================
  // 教員セットアップ画面
  // ======================================================
  function TeacherSetupScreen({ onStartClass, onBack }) {
    const [subject, setSubject] = useState('算数');
    const [classId, setClassId] = useState(() => generateClassId());
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState('');
    const [cleanedCount, setCleanedCount] = useState(0);

    // 画面表示時に古いクラスを自動削除
    useEffect(() => {
      cleanupOldClasses(24).then(n => { if (n > 0) setCleanedCount(n); });
    }, []);

    const handleStart = async () => {
      if (!classId.match(/^\d{5}$/)) { setError('授業IDは5桁の数字を入力してください'); return; }
      setLoading(true);
      setError('');
      try {
        await initClass(classId, subject);
        onStartClass({ classId, subject });

        setError('エラーが発生しました: ' + e.message);

      }

                    id="teacher-class-id-input"
                    type="text"
                    value={classId}
                    onChange={e => setClassId(e.target.value.replace(/\D/g, '').slice(0,5))}
                    maxLength={5}
                    className="input-field text-2xl font-black tracking-[0.3em] text-center"
                    style={{fontFamily: 'monospace'}}
                    placeholder="12345"
                  />
                  <button
                    id="teacher-regen-id-btn"
                    onClick={() => setClassId(generateClassId())}
                    className="px-4 py-2 rounded-xl text-white/60 hover:text-white transition-colors text-xl"
                    style={{background: 'rgba(255,255,255,0.08)', border: '1px solid rgba(255,255,255,0.15)', minWidth: '48px'}}
                    title="IDを再生成"
                  >
                    🔄
                  </button>
                </div>
                <p className="text-white/40 text-xs mt-2">このIDをこどもたちに伝えてください</p>
              </div>

              {/* 授業IDプレビュー */}
              <div className="rounded-xl p-4 text-center" style={{background: 'rgba(99,102,241,0.15)', border: '1px dashed rgba(99,102,241,0.4)'}}>
                <p className="text-white/50 text-xs font-bold tracking-widest mb-1">授業ID</p>
                <p className="text-5xl font-black tracking-[0.3em] text-indigo-300" style={{fontFamily: 'monospace'}}>
                  {classId || '- - - - -'}
                </p>
                <p className="text-white/40 text-xs mt-1">{subject}</p>
              </div>

              {error && <p className="text-red-400 text-sm text-center">{error}</p>}

              <button
                id="teacher-start-btn"
                onClick={handleStart}
                disabled={loading}
                className="btn-primary btn-teacher w-full py-4 text-lg rounded-2xl"
                style={{fontFamily: '"M PLUS Rounded 1c", sans-serif', opacity: loading ? 0.7 : 1}}
              >
                {loading ? '準備中…' : '授業開始（投影画面へ）🚀'}
              </button>
            </div>
          </div>
        </div>
        <Footer />
      </div>
    );
  }

  // ======================================================
  // 教員ダッシュボード
  // ======================================================
  function TeacherDashboard({ classId, subject, onBack }) {
    const [classData, setClassData] = useState(null);
    const [filter, setFilter] = useState('all'); // all | help | teach | wait | solo
    const [saving, setSaving] = useState(false);
    const [showQR, setShowQR] = useState(false);
    const dashboardRef = useRef(null);
    const qrCanvasRef = useRef(null);
    const startTime = useRef(new Date());

    useEffect(() => {
      const unsub = subscribeClass(classId, data => setClassData(data));
      return () => unsub();
    }, [classId]);

    // QRコードの描画
    useEffect(() => {
      if (showQR && qrCanvasRef.current && window.QRCode) {
        const baseUrl = window.location.href.split('?')[0];
        const joinUrl = `${baseUrl}?classId=${classId}&subject=${encodeURIComponent(subject)}`;
        window.QRCode.toCanvas(qrCanvasRef.current, joinUrl, {
          width: 256,
          margin: 2,
          color: { dark: '#000000', light: '#ffffff' }
        }, (error) => {
          if (error) console.error('QR生成エラー:', error);
        });
      }
    }, [showQR, classId, subject]);

    // 授業終了：データを削除して戻る
    const handleEndClass = async () => {
      const ok = window.confirm(
        `「${subject}」の授業を終了しますか？\n\nFirebaseのデータ（ID: ${classId}）を削除します。\n必要な場合は先に「画像保存」をしてください。`
      );
      if (!ok) return;
      try {
        await deleteClass(classId);
      } catch(e) {
        console.warn('削除エラー:', e);
      }
      onBack();
    };

    const students = classData ? Object.entries(classData.students || {}) : [];
    const filtered = filter === 'all'
      ? students
      : students.filter(([, s]) => s.status === filter);

    // 統計
    const totalCount = students.length;
    const helpCount = students.filter(([,s]) => s.status === 'help').length;
    const avgLevel = totalCount > 0
      ? (students.reduce((sum, [,s]) => sum + (s.understanding || 0), 0) / totalCount).toFixed(1)
      : '-';

    // 画像保存
    const handleSaveImage = async () => {
      if (!dashboardRef.current) return;
      setSaving(true);
      try {
        const canvas = await html2canvas(dashboardRef.current, {
          backgroundColor: '#0f0c29',
          scale: 2,
          useCORS: true,
          logging: false,
        });
        const link = document.createElement('a');
        link.download = `まなびメーター_${subject}_${classId}_${new Date().toISOString().slice(0,10)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch(e) {
        alert('画像保存に失敗しました: ' + e.message);
      } finally {
        setSaving(false);
      }
    };

    const FILTER_TABS = [
      { key: 'all', label: 'すべて', emoji: '👥' },
      { key: 'help', label: '教えて', emoji: '🆘' },
      { key: 'teach', label: '教えたい', emoji: '🙋' },
      { key: 'wait', label: '待って', emoji: '⏳' },
      { key: 'solo', label: '一人で', emoji: '👤' },
    ];

    return (
      <div className="min-h-screen flex flex-col">
        {/* ヘッダー */}
        <div className="sticky top-0 z-10" style={{background: 'rgba(15,12,41,0.85)', backdropFilter: 'blur(20px)', borderBottom: '1px solid rgba(255,255,255,0.08)'}}>
          <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
            {/* タイトル */}
            <div className="flex items-center gap-3 flex-1 min-w-0">
              <div className="flex items-center gap-2">
                <span className="text-2xl">📊</span>
                <div>
                  <h2 className="text-white font-black text-base leading-tight" style={{fontFamily: '"M PLUS Rounded 1c", sans-serif'}}>
                    {subject}の授業
                  </h2>
                  <p className="text-white/40 text-xs font-mono">ID: {classId}</p>
                </div>
              </div>
              {/* ライブバッジ */}
              <div className="flex items-center gap-1 px-2 py-0.5 rounded-full" style={{background: 'rgba(34,197,94,0.15)', border: '1px solid rgba(34,197,94,0.3)'}}>
                <span className="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse inline-block"></span>
                <span className="text-green-400 text-xs font-bold">LIVE</span>
              </div>
            </div>

            {/* 統計 */}
            <div className="flex gap-4 text-center">
              <div>
                <p className="text-white font-black text-xl leading-none">{totalCount}</p>
                <p className="text-white/40 text-xs">参加</p>
              </div>
              <div>
                <p className="text-red-400 font-black text-xl leading-none">{helpCount}</p>
                <p className="text-white/40 text-xs">SOS</p>
              </div>
              <div>
                <p className="text-green-400 font-black text-xl leading-none">{avgLevel}</p>
                <p className="text-white/40 text-xs">平均</p>
              </div>
            </div>

            {/* ボタン */}
            <div className="flex gap-2">
              <button
                onClick={() => setShowQR(true)}
                className="px-3 py-2 rounded-xl text-sm font-bold transition-all"
                style={{background: 'rgba(34,197,94,0.2)', border: '1px solid rgba(34,197,94,0.4)', color: '#86efac'}}
              >
                📱 QR参加
              </button>
              <button
                id="teacher-save-btn"
                onClick={handleSaveImage}
                disabled={saving}
                className="px-3 py-2 rounded-xl text-sm font-bold transition-all"
                style={{background: 'rgba(99,102,241,0.2)', border: '1px solid rgba(99,102,241,0.4)', color: '#a5b4fc', opacity: saving ? 0.6 : 1}}
              >
                {saving ? '保存中…' : '📷 画像保存'}
              </button>
              <button
                id="teacher-end-btn"
                onClick={handleEndClass}
                className="px-3 py-2 rounded-xl text-sm font-bold transition-all"
                style={{background: 'rgba(239,68,68,0.15)', border: '1px solid rgba(239,68,68,0.35)', color: '#fca5a5'}}
              >
                🗑️ 授業終了
              </button>
            </div>
          </div>

          {/* フィルタータブ */}
          <div className="max-w-7xl mx-auto px-4 pb-2 flex gap-2 overflow-x-auto no-scrollbar">
            {FILTER_TABS.map(tab => (
              <button
                key={tab.key}
                id={`filter-${tab.key}`}
                onClick={() => setFilter(tab.key)}
                className="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold transition-all"
                style={{
                  background: filter === tab.key ? 'rgba(99,102,241,0.4)' : 'rgba(255,255,255,0.07)',
                  border: filter === tab.key ? '1px solid rgba(99,102,241,0.6)' : '1px solid rgba(255,255,255,0.1)',
                  color: filter === tab.key ? '#c7d2fe' : 'rgba(255,255,255,0.5)',
                }}
              >
                {tab.emoji} {tab.label}
                {tab.key !== 'all' && (
                  <span className="ml-1 opacity-70">
                    ({students.filter(([,s]) => s.status === tab.key).length})
                  </span>
                )}
              </button>
            ))}
          </div>
        </div>

        {/* ダッシュボード本体（画像保存対象） */}
        <div ref={dashboardRef} className="flex-1 max-w-7xl mx-auto w-full px-4 py-6">
          {/* 保存時に表示するヘッダー情報 */}
          <div className="hidden-in-screen mb-4 glass p-3 flex items-center gap-3" style={{display:'none'}} id="save-header">
            <span className="text-2xl">📊</span>
            <div>
              <p className="font-black text-white">{subject}の授業 | ID: {classId}</p>
              <p className="text-white/50 text-xs">{formatTime(startTime.current)} | 作成者：黒田先生</p>
            </div>
          </div>

          {filtered.length === 0 ? (
            <div className="text-center py-20 animate-fade-in">
              <div className="text-5xl mb-4">
                {filter === 'all' ? '⏰' : STATUS_CONFIG[filter]?.emoji}
              </div>
              <p className="text-white/40 text-sm">
                {filter === 'all' ? 'こどもたちの参加を待っています…' : `「${STATUS_CONFIG[filter]?.label}」の児童はいません`}
              </p>
            </div>
          ) : (
            <div className="grid gap-3" style={{gridTemplateColumns: 'repeat(auto-fill, minmax(160px, 1fr))'}}>
              {filtered.map(([key, student]) => (
                <StudentCard key={key} studentKey={key} student={student} />
              ))}
            </div>
          )}
        </div>

        {/* QRコードモーダル */}
        {showQR && (
          <div className="fixed inset-0 flex items-center justify-center z-50 p-4" style={{background: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(5px)'}}>
            <div className="glass-strong p-6 rounded-3xl max-w-sm w-full text-center relative animate-fade-in">
              <button onClick={() => setShowQR(false)} className="absolute top-4 right-4 text-white/50 hover:text-white text-xl">
                ✕
              </button>
              <h3 className="text-xl font-black text-white mb-2" style={{fontFamily: '"M PLUS Rounded 1c", sans-serif'}}>参加用QRコード</h3>
              <p className="text-white/60 text-xs mb-6">こどもたちの端末で読み取ってください<br/>IDと教科が自動で入力されます</p>
              <div className="bg-white p-2 rounded-xl inline-block mx-auto mb-4">
                <canvas ref={qrCanvasRef}></canvas>
              </div>
              <p className="text-3xl font-black tracking-[0.3em] text-indigo-300 mb-2" style={{fontFamily: 'monospace'}}>
                {classId}
              </p>
            </div>
          </div>
        )}

        <Footer />
      </div>
    );
  }

  // ======================================================
  // 児童カードコンポーネント
  // ======================================================
  function StudentCard({ studentKey, student }) {
    const lvCfg = LEVEL_CONFIG.find(l => l.level === student.understanding) || LEVEL_CONFIG[2];
    const stCfg = STATUS_CONFIG[student.status];
    const isHelp = student.status === 'help';

    return (
      <div className={`student-card p-4 ${isHelp ? 'help-highlight' : ''}`}>
        {/* 名前 */}
        <p className="text-white font-bold text-sm truncate mb-2" title={student.name}>
          {student.name || studentKey}
        </p>

        {/* 理解度バー */}
        <div className="flex items-center gap-2 mb-2">
          <div className={`w-8 h-8 rounded-lg flex items-center justify-center text-white font-black text-sm ${lvCfg.className}`}
            style={{boxShadow: `0 0 10px ${lvCfg.shadow}`}}>
            {student.understanding || '-'}
          </div>
          <div className="flex-1">
            <div className="w-full rounded-full h-1.5" style={{background: 'rgba(255,255,255,0.1)'}}>
              <div
                className={`h-1.5 rounded-full ${lvCfg.className}`}
                style={{width: `${(student.understanding || 0) * 20}%`, transition: 'width 0.4s ease'}}
              />
            </div>
            <p className="text-white/40 text-xs mt-0.5">{lvCfg.label}</p>
          </div>
        </div>

        {/* ステータス */}
        {stCfg && (
          <div className={`badge ${stCfg.badgeClass} w-full justify-center`}>
            <span>{stCfg.emoji}</span>
            <span>{stCfg.label}</span>
          </div>
        )}
      </div>
    );
  }

  // ======================================================
  // 児童参加画面
  // ======================================================
  function StudentJoinScreen({ onJoin, onBack, initialData }) {
    const [subject, setSubject] = useState(initialData?.subject || '算数');
    const [classId, setClassId] = useState(initialData?.classId || '');
    const [name, setName] = useState(() => localStorage.getItem('manabi_student_name') || '');
    const [loading, setLoading] = useState(false);
    const [error, setError] = useState('');

    const handleJoin = async () => {
      if (!classId.match(/^\d{5}$/)) { setError('授業IDは5桁の数字を入力してください'); return; }
      if (!name.trim()) { setError('名前か出席番号を入力してください'); return; }
      setLoading(true);
      setError('');

      // 名前をローカルストレージに保存
      localStorage.setItem('manabi_student_name', name.trim());

      // こどもモードはFirestoreに接続確認せずそのまま参加
      // （先生が授業を開始していない場合は初回送信時に自動作成）
      onJoin({ classId: classId.trim(), subject, name: name.trim() });
    };

    return (
      <div className="min-h-screen flex flex-col">
        <div className="flex-1 flex flex-col items-center justify-center px-6 py-12">
          <div className="w-full max-w-md animate-slide-up">
            <button onClick={onBack} className="text-white/40 hover:text-white/70 transition-colors text-sm mb-6 flex items-center gap-1">
              ← もどる
            </button>
            <div className="text-center mb-8">
              <div className="text-5xl mb-3">🧒</div>
              <h2 className="text-2xl font-black text-white" style={{fontFamily: '"M PLUS Rounded 1c", sans-serif'}}>
                じゅぎょうに参加する
              </h2>
              <p className="text-white/50 text-sm mt-1">先生から聞いた情報を入力してね</p>
            </div>

            <div className="glass-strong p-8 flex flex-col gap-5">
              {/* 教科 */}
              <div>
                <label className="form-label">📚 教科</label>
                <select id="student-subject-select" value={subject} onChange={e => setSubject(e.target.value)} className="input-field">
                  {SUBJECTS.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>

              {/* 授業ID */}
              <div>
                <label className="form-label">🔑 授業ID（5桁）</label>
                <input
                  id="student-class-id-input"
                  type="tel"
                  value={classId}
                  onChange={e => setClassId(e.target.value.replace(/\D/g, '').slice(0,5))}
                  maxLength={5}
                  className="input-field text-3xl font-black tracking-[0.3em] text-center"
                  style={{fontFamily: 'monospace'}}
                  placeholder="12345"
                />
              </div>

              {/* 名前 */}
              <div>
                <label className="form-label">🏷️ 名前 または 出席番号</label>
                <input
                  id="student-name-input"
                  type="text"
                  value={name}
                  onChange={e => setName(e.target.value)}
                  className="input-field text-lg"
                  placeholder="例：田中 / 1番"
                  maxLength={20}
                />
              </div>

              {error && <p className="text-red-400 text-sm text-center">{error}</p>}

              <button
                id="student-join-btn"
                onClick={handleJoin}
                disabled={loading}
                className="btn-primary btn-student w-full py-4 text-lg rounded-2xl"
                style={{fontFamily: '"M PLUS Rounded 1c", sans-serif', opacity: loading ? 0.7 : 1}}
              >
                {loading ? '参加中…' : '参加する 🎉'}
              </button>
            </div>
          </div>
        </div>
        <Footer />
      </div>
    );
  }

  // ======================================================
  // 児童入力画面（送信専用）
  // ======================================================
  function StudentInputScreen({ classId, subject, name, onBack }) {
    const [understanding, setUnderstanding] = useState(null);
    const [status, setStatus] = useState(null);
    const [sendFlash, setSendFlash] = useState(false);
    const [lastSent, setLastSent] = useState(null);
    const [pendingUpdate, setPendingUpdate] = useState(false);

    // 児童のキー（名前をキーに使用。スペース等を除去）
    const studentKey = name.replace(/[.#$/\[\]]/g, '_');

    // Firestoreへ送信（デバウンス1秒）
    const sendToFirestore = useCallback(async (newUnderstanding, newStatus) => {
      if (!newUnderstanding && !newStatus) return;
      setPendingUpdate(false);
      try {
        await updateStudent(classId, studentKey, {
          name,
          understanding: newUnderstanding,
          status: newStatus,
        });
        setLastSent(new Date());
        setSendFlash(true);
        setTimeout(() => setSendFlash(false), 1200);
      } catch(e) {
        console.error('送信エラー:', e);
      }
    }, [classId, studentKey, name]);

    const debouncedSend = useDebounce(sendToFirestore, 1000);

    const handleLevelSelect = (level) => {
      setUnderstanding(level);
      setPendingUpdate(true);
      debouncedSend(level, status);
    };

    const handleStatusSelect = (s) => {
      setStatus(s);
      setPendingUpdate(true);
      debouncedSend(understanding, s);
    };

    const lvCfg = understanding ? LEVEL_CONFIG.find(l => l.level === understanding) : null;

    return (
      <div className="min-h-screen flex flex-col">
        {/* ヘッダー */}
        <div className="sticky top-0 z-10 px-4 py-3 flex items-center justify-between"
          style={{background: 'rgba(15,12,41,0.85)', backdropFilter: 'blur(20px)', borderBottom: '1px solid rgba(255,255,255,0.08)'}}>
          <div>
            <p className="text-white font-bold text-sm">{name}</p>
            <p className="text-white/40 text-xs">{subject} | ID: {classId}</p>
          </div>

          {/* 送信状態インジケーター */}
          <div className="flex items-center gap-2">
            {pendingUpdate && (
              <div className="flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-yellow-400 animate-pulse inline-block"></span>
                <span className="text-yellow-300 text-xs">送信中…</span>
              </div>
            )}
            {!pendingUpdate && lastSent && (
              <div className="flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-green-400 inline-block"></span>
                <span className="text-green-300 text-xs">送信済み ✓</span>
              </div>
            )}
          </div>
        </div>

        {/* 送信フラッシュ */}
        {sendFlash && (
          <div className="fixed inset-0 flex items-center justify-center z-50 pointer-events-none">
            <div className="flash-send glass-strong px-8 py-4 text-center">
              <div className="text-3xl mb-1">✅</div>
              <p className="text-white font-bold text-sm">先生に伝わったよ！</p>
            </div>
          </div>
        )}

        <div className="flex-1 flex flex-col gap-6 px-4 py-6 max-w-lg mx-auto w-full">
          {/* 理解度セクション */}
          <div className="glass p-5">
            <h3 className="text-center font-black text-lg text-white mb-1" style={{fontFamily: '"M PLUS Rounded 1c", sans-serif'}}>
              いまの理解度は？
            </h3>
            <p className="text-center text-white/40 text-xs mb-4">ボタンをおして先生に伝えよう</p>

            {/* 5段階ボタン */}
            <div className="grid grid-cols-5 gap-2">
              {LEVEL_CONFIG.map(cfg => (
                <button
                  key={cfg.level}
                  id={`level-btn-${cfg.level}`}
                  onClick={() => handleLevelSelect(cfg.level)}
                  className={`level-btn ${cfg.className} ${understanding === cfg.level ? 'selected' : ''}`}
                  style={{
                    height: '110px',
                    boxShadow: understanding === cfg.level ? `0 0 20px ${cfg.shadow}` : `0 4px 12px ${cfg.shadow}`,
                    color: 'white',
                    padding: '8px 4px',
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: 'center',
                    justifyContent: 'center',
                    gap: '4px',
                  }}
                >
                  <span style={{fontSize: '1.8rem', lineHeight: 1}}>{cfg.emoji}</span>
                  <span style={{fontSize: '1.4rem', fontWeight: 900, lineHeight: 1}}>{cfg.level}</span>
                  <span style={{fontSize: '0.6rem', fontWeight: 700, lineHeight: 1.2, textAlign: 'center', opacity: 0.92, padding: '0 2px', wordBreak: 'keep-all'}}>
                    {cfg.label}
                  </span>
                </button>
              ))}
            </div>

            {/* 選択中インジケーター */}
            {lvCfg && (
              <div className={`mt-3 rounded-xl p-2 text-center ${lvCfg.className}`} style={{background: 'rgba(255,255,255,0.1)'}}>
                <p className="text-white font-bold text-sm">
                  {lvCfg.emoji} レベル {lvCfg.level}「{lvCfg.label}」を選択中
                </p>
              </div>
            )}
          </div>

          {/* 意思表示セクション */}
          <div className="glass p-5">
            <h3 className="text-center font-black text-lg text-white mb-1" style={{fontFamily: '"M PLUS Rounded 1c", sans-serif'}}>
              いまの気持ちは？
            </h3>
            <p className="text-center text-white/40 text-xs mb-4">先生に伝えたいことをえらぼう</p>

            <div className="grid grid-cols-2 gap-3">
              {Object.entries(STATUS_CONFIG).map(([key, cfg]) => (
                <button
                  key={key}
                  id={`status-btn-${key}`}
                  onClick={() => handleStatusSelect(key)}
                  className={`status-btn ${status === key ? cfg.className : ''}`}
                  style={{minHeight: '70px', fontSize: '0.82rem'}}
                >
                  <span style={{fontSize: '1.4rem'}}>{cfg.emoji}</span>
                  <span className="font-bold leading-tight text-center">{cfg.label}</span>
                </button>
              ))}
            </div>
          </div>

          {/* 未選択の場合のヒント */}
          {!understanding && !status && (
            <div className="text-center py-2 animate-fade-in">
              <p className="text-white/30 text-sm">👆 ボタンをおして先生に伝えよう！</p>
            </div>
          )}
        </div>

        <Footer />
      </div>
    );
  }

  // ======================================================
  // メインアプリコンポーネント
  // ======================================================
  function App() {
    const [screen, setScreen] = useState('mode-select'); // mode-select | teacher-setup | teacher-dashboard | student-join | student-input
    const [teacherInfo, setTeacherInfo] = useState(null);
    const [studentInfo, setStudentInfo] = useState(null);
    const [initialJoinData, setInitialJoinData] = useState(null);

    // URLパラメータの確認（QRコードからの遷移時）
    useEffect(() => {
      const params = new URLSearchParams(window.location.search);
      const qClassId = params.get('classId');
      const qSubject = params.get('subject');
      
      if (qClassId) {
        setInitialJoinData({ classId: qClassId, subject: qSubject || '算数' });
        setScreen('student-join');
      }
    }, []);

    const handleTeacherStart = (info) => {
      setTeacherInfo(info);
      setScreen('teacher-dashboard');
    };

    const handleStudentJoin = (info) => {
      setStudentInfo(info);
      setScreen('student-input');
    };

    return (
      <div className="min-h-screen">
        {screen === 'mode-select' && (
          <ModeSelectScreen
            onSelectTeacher={() => setScreen('teacher-setup')}
            onSelectStudent={() => setScreen('student-join')}
          />
        )}
        {screen === 'teacher-setup' && (
          <TeacherSetupScreen
            onStartClass={handleTeacherStart}
            onBack={() => setScreen('mode-select')}
          />
        )}
        {screen === 'teacher-dashboard' && teacherInfo && (
          <TeacherDashboard
            classId={teacherInfo.classId}
            subject={teacherInfo.subject}
            onBack={() => setScreen('mode-select')}
          />
        )}
        {screen === 'student-join' && (
          <StudentJoinScreen
            initialData={initialJoinData}
            onJoin={handleStudentJoin}
            onBack={() => setScreen('mode-select')}
          />
        )}
        {screen === 'student-input' && studentInfo && (
          <StudentInputScreen
            classId={studentInfo.classId}
            subject={studentInfo.subject}
            name={studentInfo.name}
            onBack={() => setScreen('mode-select')}
          />
        )}
      </div>
    );
  }

  // ======================================================
  // レンダリング
  // ======================================================
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
